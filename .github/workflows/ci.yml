name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kai/web lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm --filter @kai/web build

  api:
    runs-on: ubuntu-latest
    env:
      KAI_TEST_DATABASE_URL: postgresql://kai:kai-local-password@127.0.0.1:5432/kai_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kai
          POSTGRES_PASSWORD: kai-local-password
          POSTGRES_DB: kai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kai -d kai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python infrastructure/postgres/bootstrap_test_db.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
